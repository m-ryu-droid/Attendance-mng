<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤怠管理 / Attendance</title>
  <link rel="stylesheet" href="styles.css?v=20260616-1" />
</head>
<body>
<div class="container">
  <div class="header">
    <div style="width:72px"></div>
    <div class="header-center">
      <h1>⏱ <span data-i18n="title">勤怠管理</span></h1>
      <div class="date" id="today-date"></div>
    </div>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('ja')">JA</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="selectStaff">スタッフ選択</div>
    <div class="form-group">
      <label data-i18n="name">名前</label>
      <select id="sel-name" onchange="onNameChange()">
        <option value="" data-i18n-opt="loading">読み込み中...</option>
      </select>
      <p class="notice" data-i18n="locationNotice">出勤時のみ、現在地情報を取得して送信します。</p>
    </div>
  </div>

  <div class="state-panel">
    <div class="state-copy">
      <span class="state-label" data-i18n="currentStatus">現在の状態</span>
      <strong id="current-state">出勤前</strong>
      <span id="state-detail">名前を選択してください</span>
    </div>
    <div class="checkout-panel" id="checkout-panel">
      <div class="checkout-panel-head">
        <span>退勤前チェック</span>
        <strong>交通費または画像が必須</strong>
      </div>
      <div class="fare-grid">
        <label>
          行き
          <input id="fare-go" type="number" inputmode="numeric" min="0" placeholder="例 800" />
        </label>
        <label>
          帰り
          <input id="fare-return" type="number" inputmode="numeric" min="0" placeholder="例 950" />
        </label>
      </div>
      <label class="file-field">
        添付
        <input id="commute-files" type="file" accept="image/*" multiple />
        <span id="file-summary">画像は3枚まで</span>
      </label>
      <label class="memo-field">
        メモ
        <textarea id="memo" rows="2" placeholder="伝えたいことがあれば入力"></textarea>
      </label>
      <p class="checkout-note" id="checkout-note">交通費がない場合は、行き・帰りに0を入力してください。</p>
    </div>
    <button class="primary-action" id="primary-action" type="button" disabled>
      <span class="primary-kicker" data-i18n="nextAction">次の操作</span>
      <span class="primary-label" id="primary-label">出勤</span>
      <span class="primary-time" id="primary-time">--:--</span>
    </button>
  </div>

  <div class="card action-card">
    <div class="card-title">選べる操作</div>
    <p class="action-hint">明るく表示されているボタンが今押せる操作です。</p>

    <div class="step-bar">
      <div class="step">
        <div class="step-dot" id="step-checkin"></div>
        <div class="step-label" data-i18n="stepIn">出勤</div>
      </div>
      <div class="step-line" id="line-break"></div>
      <div class="step">
        <div class="step-dot" id="step-break"></div>
        <div class="step-label" data-i18n="stepBreak">休憩</div>
      </div>
      <div class="step-line" id="line-breakend"></div>
      <div class="step">
        <div class="step-dot" id="step-breakend"></div>
        <div class="step-label" data-i18n="stepBreakEnd">休憩終了</div>
      </div>
      <div class="step-line" id="line-checkout"></div>
      <div class="step">
        <div class="step-dot" id="step-checkout"></div>
        <div class="step-label" data-i18n="stepOut">退勤</div>
      </div>
    </div>

    <div class="btn-grid secondary-actions" aria-label="打刻操作">
      <button class="btn-action btn-checkin" onclick="record('出勤')" id="btn-checkin" disabled>
